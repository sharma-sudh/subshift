name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subshift_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Fails the build if schema.sql has a syntax error or can no longer be applied.
      - name: Apply database schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d subshift_db -v ON_ERROR_STOP=1 -f db/schema.sql

      # Checks the price-change trigger, the spend function and the mark_all_alerts_read stored procedure.
      - name: Database tests (trigger and stored procedure)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d subshift_db -v ON_ERROR_STOP=1 -f db/tests/trigger_and_procedure_test.sql

      - name: Build backend and run unit tests
        working-directory: backend
        run: mvn -B package

      # Boots the real app against the schema. Hibernate runs with ddl-auto=validate, so this also
      # fails if any JPA entity no longer matches the tables.
      - name: Smoke test (start the app, call the health endpoint)
        working-directory: backend
        env:
          DB_NAME: subshift_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          touch .env
          export JWT_SECRET="$(openssl rand -base64 48)"
          export TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          java -jar target/backend-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "App started and /api/health responded"
              exit 0
            fi
            sleep 3
          done
          echo "The app did not start within two minutes. Application log:"
          cat app.log
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t subshift-backend:ci ./backend
