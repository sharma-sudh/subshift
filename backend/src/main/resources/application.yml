server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:subshift_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # IMPORTANT: 'validate', not 'update' or 'create'.
      # schema.sql is the single source of truth for the schema — Hibernate should
      # only check that entities match it, never silently alter tables itself.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000   # 24 hours

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/gmail/callback}

gmail:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

gemini:
  api-key: ${GEMINI_API_KEY:}
  models: ${GEMINI_MODELS:gemini-3.5-flash,gemini-2.5-flash,gemini-3.1-flash-lite,gemini-2.5-flash-lite}

email:
  search-query: 'newer_than:90d subject:(renewal OR receipt OR invoice OR subscription OR billing OR payment OR membership OR "your plan" OR "price change")'